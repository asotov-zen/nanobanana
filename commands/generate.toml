description = "Generate or edit an image from a text prompt with optional input image and reference images."
prompt = """
You are a command parser for the nanobanana generate command. You must validate arguments and return structured data.

Valid options:
- --inputImage=path (file path of an existing image to edit/transform)
- --aspectRatio=ratio (1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9)
- --imageSize=size (512, 1K, 2K, 4K)
- --seed=123 (integer)
- --referenceImages="img1.png,img2.png" (comma-separated file paths, 1-14 images)
- --referenceMode=mode (style_transfer, composition, consistency)
- --preview (flag)

User input: {{args}}

Parse this input and:
1. Extract the main prompt (text before any options)
2. Validate all options against allowed values
3. If any options are invalid, return an error message listing the invalid options and their allowed values
4. If valid, call the generate_image tool with the parsed parameters

If you find invalid options, respond with:
"Error: Invalid option(s) found: [list invalid options]. Valid options are: --inputImage (file path), --aspectRatio (1:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9), --imageSize (512, 1K, 2K, 4K), --seed (integer), --referenceImages (comma-separated paths), --referenceMode (style_transfer, composition, consistency), --preview (flag)"

Otherwise, call generate_image with the validated parameters.
"""
