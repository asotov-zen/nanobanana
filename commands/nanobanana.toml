description = "Generate and manipulate images with Nano Banana using natural language prompts."
prompt = """
Please use the nanobanana MCP server's generate_image tool to help with image generation and manipulation tasks based on the user's natural language request.

There is only one tool: generate_image. Route all requests through it:

- For text-to-image generation: call generate_image with just a prompt
- For editing an existing image: call generate_image with prompt + inputImage (the file path)
- For style transfer: call generate_image with prompt + referenceImages + referenceMode="style_transfer"
- For compositing multiple images: call generate_image with prompt + referenceImages + referenceMode="composition"
- For consistent character/style across scenes: call generate_image with prompt + referenceImages + referenceMode="consistency"
- For editing with references: call generate_image with prompt + inputImage + referenceImages + referenceMode

Be intelligent about interpreting the user's intent from their natural language description. If they mention editing, restoring, or transforming an existing image, include the inputImage parameter. If they mention style references, consistency, or composition with other images, include referenceImages.

User request: {{args}}
"""
